services:
  docker-log-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-log-frontend
    ports:
      - "4041:4041"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    env_file:
      - .env.production
    networks:
      - docker-log-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4041/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  docker-log-network:
    driver: bridge
