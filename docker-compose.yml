services:
  docker-log-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: docker-log-frontend
    ports:
      - "4041:4041"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - VITE_APP_TITLE=Docker日志查询服务
      - VITE_APP_BASE_API=/api
      - VITE_APP_PORT=4041
      - VITE_APP_BACKEND_URL=${VITE_APP_BACKEND_URL:-https://log.animeparadise.vip}
      - BACKEND_HOST=${BACKEND_HOST:-host.docker.internal}
      - BACKEND_PORT=${BACKEND_PORT:-9091}
      - SERVER_NAME=${SERVER_NAME:-localhost}
    env_file:
      - .env.production
    networks:
      - docker-log-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4041/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  docker-log-network:
    driver: bridge
